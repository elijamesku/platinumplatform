# Latency Injection Chaos Experiment
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: latency-injection
  namespace: chaos-testing
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - apps
    labelSelectors:
      app: microservice-1
  delay:
    latency: "500ms"
    correlation: "100"
    jitter: "0ms"
  duration: "2m"

